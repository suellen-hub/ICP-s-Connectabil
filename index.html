function u(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function open_(pw){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(S),iterations:N,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(V)},k,u(C));
  return new TextDecoder().decode(pt);
}
async function go(pw,silent){
  var bt=document.getElementById("bt"),err=document.getElementById("err");
  bt.disabled=true;bt.textContent="Abrindo…";
  try{var h=await open_(pw);try{sessionStorage.setItem("icp_pw",pw)}catch(e){}
    document.open();document.write(h);document.close();}
  catch(e){bt.disabled=false;bt.textContent="Abrir documento";
    if(!silent)err.textContent="Senha incorreta. Confira maiúsculas, números e o símbolo @.";}
}
